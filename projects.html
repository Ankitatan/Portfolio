<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Ankita Taneja - GAIverse</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Navbar -->
  <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold tracking-tight text-white hover:text-cyan-400 transition">
        Ankita Taneja <span class="text-cyan-400 text-sm font-mono font-normal">| GAIverse</span>
      </a>
      <div class="space-x-6 text-sm font-medium">
        <a href="index.html" class="text-slate-400 hover:text-white transition">Home</a>
        <a href="projects.html" class="text-cyan-400 font-semibold">Projects</a>
      </div>
    </div>
  </nav>

  <!-- Projects Header & Grid -->
  <main class="max-w-6xl mx-auto px-6 py-12">
    <div class="mb-10">
      <h1 class="text-4xl font-extrabold text-white">Project Showcase</h1>
      <p class="text-slate-400 mt-2">Click any project to read the full case study and documentation directly from GitHub.</p>
    </div>

    <!-- Grid Container -->
    <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Cards rendered below -->
    </div>
  </main>

  <script>
    // YOUR GITHUB USERNAME
    const GITHUB_USERNAME = "Ankitatan";

    // YOUR REPOSITORIES LIST
    // Replace 'repo-name' with the exact repository name from your GitHub account
    const projects = [
      {
        slug: "equity-research-tool", // Change this to your exact repo name
        title: "Equity Research News Summarizer",
        description: "Automated news summarization and financial insights pipeline leveraging LLMs and Streamlit.",
        tags: ["Generative AI", "LangChain", "Streamlit", "Python"]
      },
      {
        slug: "model-optimization-app", // Change this to your exact repo name
        title: "Predictive Model Optimization Suite",
        description: "Multi-class classification pipeline comparing ensemble models with hyperparameter tuning.",
        tags: ["Machine Learning", "Scikit-Learn", "EDA", "Python"]
      }
    ];

    // Render Cards
    const grid = document.getElementById("project-grid");
    
    grid.innerHTML = projects.map(p => {
      // Direct relative link to the detail page
      const targetUrl = `./project-detail.html?repo=${encodeURIComponent(p.slug)}&title=${encodeURIComponent(p.title)}`;

      return `
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col justify-between hover:border-cyan-500/50 hover:shadow-lg transition">
          <div>
            <div class="flex flex-wrap gap-2 mb-3">
              ${p.tags.map(t => `<span class="bg-cyan-950 text-cyan-400 border border-cyan-800/40 text-xs px-2.5 py-0.5 rounded-full font-mono">${t}</span>`).join('')}
            </div>
            <h2 class="text-xl font-bold text-white mb-2">${p.title}</h2>
            <p class="text-slate-400 text-sm leading-relaxed">${p.description}</p>
          </div>
          <div class="mt-6 pt-4 border-t border-slate-800">
            <a href="${targetUrl}" 
               class="inline-flex items-center text-sm font-semibold text-cyan-400 hover:text-cyan-300">
              Read Case Study & README &rarr;
            </a>
          </div>
        </div>
      `;
    }).join('');
  </script>
</body>
</html>
